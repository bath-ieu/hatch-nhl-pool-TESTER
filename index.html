<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pool de Hockey Super Pool 2026-2027</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-red: #ef4444; /* Remplacement de l'orange par le rouge */
            --accent-red-hover: #dc2626;
            --border-color: #334155;
            --gold: #f59e0b;
            --silver: #94a3b8;
            --bronze: #b45309;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--accent-red);
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Navigation par onglets */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background-color: var(--bg-card-hover);
        }

        .tab-btn.active {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
        }

        /* Contenu des sections */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Tableaux généraux */
        .table-responsive {
            overflow-x: auto;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        tr:hover {
            background-color: var(--bg-card-hover);
        }

        /* Graphique */
        .chart-container {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            position: relative;
            height: 450px;
        }

        /* Section Confrontation */
        .confrontation-selectors {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media(max-width: 768px) {
            .confrontation-selectors {
                grid-template-columns: 1fr;
            }
        }

        .select-box {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .select-box label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-muted);
        }

        select {
            width: 100%;
            padding: 12px;
            background: var(--bg-main);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
        }

        .confrontation-results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .team-card {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .team-card h3 {
            border-bottom: 2px solid var(--accent-red);
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: var(--accent-red);
        }

        /* Section Statistiques & Badges */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .stat-card.full-width {
            grid-column: 1 / -1;
        }

        .stat-card h3 {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-red);
        }

        .badges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .badge-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge-icon {
            font-size: 2.5rem;
        }

        .badge-info h4 {
            margin-bottom: 5px;
        }

        .badge-info p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Pool de Hockey Super Pool</h1>
            <p id="last-update">Dernière mise à jour : Chargement...</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('classement')">Classement & Progression</button>
            <button class="tab-btn" onclick="switchTab('confrontation')">Confrontation</button>
            <button class="tab-btn" onclick="switchTab('statistiques')">Statistiques & Badges</button>
        </div>

        <!-- Onglet 1 : Classement -->
        <div id="classement" class="section active">
            <div class="chart-container">
                <canvas id="progressionChart"></canvas>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Rang</th>
                            <th>Participant</th>
                            <th>Total Pts</th>
                            <th>Attaque</th>
                            <th>Défense</th>
                            <th>Gardiens</th>
                            <th>Équipe</th>
                            <th>Tendance</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Rempli par JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Onglet 2 : Confrontation -->
        <div id="confrontation" class="section">
            <div class="confrontation-selectors">
                <div class="select-box">
                    <label for="select-p1">Premier participant</label>
                    <select id="select-p1" onchange="updateConfrontation()">
                        <option value="">-- Choisir un participant --</option>
                    </select>
                </div>
                <div class="select-box">
                    <label for="select-p2">Deuxième participant</label>
                    <select id="select-p2" onchange="updateConfrontation()">
                        <option value="">-- Choisir un participant --</option>
                    </select>
                </div>
            </div>

            <div class="confrontation-results" id="confrontation-results">
                <div class="team-card" style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">
                    Sélectionnez deux participants ci-dessus pour comparer leurs alignements.
                </div>
            </div>
        </div>

        <!-- Onglet 3 : Statistiques & Badges -->
        <div id="statistiques" class="section">
            <h2 style="margin-bottom: 20px; color: var(--accent-red);">Records de Productivité</h2>
            <div class="stats-grid" id="records-grid">
                <!-- Rempli dynamiquement (séparés et pleine largeur) -->
            </div>

            <h2 style="margin-bottom: 20px; color: var(--accent-red); margin-top: 40px;">Badges & Distinctions</h2>
            <div class="badges-grid" id="badges-grid">
                <!-- Rempli dynamiquement -->
            </div>
        </div>
    </div>

    <script>
        let poolData = null;
        let progressionChart = null;

        // Charger les données depuis data.json
        async function loadData() {
            try {
                const response = await fetch('data.json');
                poolData = await response.json();
                
                document.getElementById('last-update').innerText = `Dernière mise à jour : ${new Date(poolData.updated_at).toLocaleString('fr-FR')}`;
                
                initLeaderboard();
                initChart();
                initConfrontationSelectors();
                initStatisticsAndBadges();
            } catch (error) {
                console.error("Erreur lors du chargement des données:", error);
                document.getElementById('last-update').innerText = "Erreur de chargement des données (data.json)";
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');

            if (tabId === 'classement' && progressionChart) {
                progressionChart.update();
            }
        }

        // --- SECTION 1 : CLASSEMENT ---
        function initLeaderboard() {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';

            poolData.leaderboard.forEach((p, index) => {
                let trendIcon = '➖';
                if (p.trend === 'up') trendIcon = '📈';
                if (p.trend === 'down') trendIcon = '📉';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>#${index + 1}</strong></td>
                    <td>${p.name}</td>
                    <td><strong>${p.total_points}</strong></td>
                    <td>${p.att_pts}</td>
                    <td>${p.def_pts}</td>
                    <td>${p.goalie_pts}</td>
                    <td>${p.team_pts}</td>
                    <td>${trendIcon}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- GRAPHIQUE ---
        function initChart() {
            const ctx = document.getElementById('progressionChart').getContext('2d');
            const labels = poolData.chart_dates || ["Début"];
            
            const datasets = poolData.leaderboard.map((p, index) => {
                const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'];
                return {
                    label: p.name,
                    data: p.history || [p.total_points],
                    borderColor: colors[index % colors.length],
                    backgroundColor: colors[index % colors.length],
                    borderWidth: 2,
                    tension: 0.1,
                    hidden: index >= 5 // Cacher les premiers par défaut pour lisibilité
                };
            });

            progressionChart = new Chart(ctx, {
                type: 'line',
                data: { labels: labels, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#f8fafc' }
                        },
                        title: {
                            display: true,
                            text: 'Évolution de la position / points des participants',
                            color: '#f8fafc',
                            font: { size: 16 }
                        }
                    },
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                    }
                }
            });
        }

        // --- SECTION 2 : CONFRONTATION (Laissé vide au départ) ---
        function initConfrontationSelectors() {
            const sel1 = document.getElementById('select-p1');
            const sel2 = document.getElementById('select-p2');

            poolData.leaderboard.forEach(p => {
                sel1.add(new Option(p.name, p.name));
                sel2.add(new Option(p.name, p.name));
            });
            // Les sélections restent vides au départ comme demandé
        }

        function updateConfrontation() {
            const name1 = document.getElementById('select-p1').value;
            const name2 = document.getElementById('select-p2').value;
            const container = document.getElementById('confrontation-results');

            if (!name1 || !name2) {
                container.innerHTML = `<div class="team-card" style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">Sélectionnez deux participants pour lancer la comparaison.</div>`;
                return;
            }

            const p1 = poolData.leaderboard.find(p => p.name === name1);
            const p2 = poolData.leaderboard.find(p => p.name === name2);

            container.innerHTML = `
                <div class="team-card">
                    <h3>${p1.name} (${p1.total_points} pts)</h3>
                    <p><strong>Attaque:</strong> ${p1.att_pts} pts | <strong>Défense:</strong> ${p1.def_pts} pts</p>
                    <p><strong>Gardiens:</strong> ${p1.goalie_pts} pts | <strong>Équipe:</strong> ${p1.team_pts} pts</p>
                </div>
                <div class="team-card">
                    <h3>${p2.name} (${p2.total_points} pts)</h3>
                    <p><strong>Attaque:</strong> ${p2.att_pts} pts | <strong>Défense:</strong> ${p2.def_pts} pts</p>
                    <p><strong>Gardiens:</strong> ${p2.goalie_pts} pts | <strong>Équipe:</strong> ${p2.team_pts} pts</p>
                </div>
            `;
        }

        // --- SECTION 3 : STATISTIQUES ET BADGES ---
        function initStatisticsAndBadges() {
            const recordsGrid = document.getElementById('records-grid');
            recordsGrid.innerHTML = '';

            // Calcul dynamique ou lecture des records depuis history
            let maxEvening = 0, eveningHolder = "Aucun";
            let maxWeekly = 0, weeklyHolder = "Aucun";
            let maxMonthly = 0, monthlyHolder = "Aucun";

            poolData.leaderboard.forEach(p => {
                if (p.history && p.history.length > 1) {
                    for (let i = 1; i < p.history.length; i++) {
                        let diff = p.history[i] - p.history[i-1];
                        if (diff > maxEvening) {
                            maxEvening = diff;
                            eveningHolder = p.name;
                        }
                    }
                }
                if (p.total_points > maxWeekly) {
                    maxWeekly = p.total_points;
                    weeklyHolder = p.name;
                }
            });
            maxMonthly = maxWeekly * 4; // Estimation si non fourni
            monthlyHolder = weeklyHolder;

            // Affichage séparé et plein format horizontalement
            recordsGrid.innerHTML = `
                <div class="stat-card full-width">
                    <h3>Record de points en une soirée (Mise à jour)</h3>
                    <div class="value">+${maxEvening} pts <span style="font-size: 1rem; color: var(--text-muted);">(${eveningHolder})</span></div>
                </div>
                <div class="stat-card full-width">
                    <h3>Record de points sur une semaine</h3>
                    <div class="value">${maxWeekly} pts <span style="font-size: 1rem; color: var(--text-muted);">(${weeklyHolder})</span></div>
                </div>
                <div class="stat-card full-width">
                    <h3>Record de points sur un mois</h3>
                    <div class="value">${maxMonthly} pts <span style="font-size: 1rem; color: var(--text-muted);">(${monthlyHolder})</span></div>
                </div>
            `;

            // Badges avec gestion des ex-aequo
            const badgesGrid = document.getElementById('badges-grid');
            badgesGrid.innerHTML = '';

            // Trouver les max points pour attributs de badges dynamiques
            let maxPts = Math.max(...poolData.leaderboard.map(p => p.total_points));
            let leaders = poolData.leaderboard.filter(p => p.total_points === maxPts).map(p => p.name).join(', ');

            let badges = [
                { icon: '👑', title: 'Le Meneur (Leader)', desc: `Détenu par : ${leaders}` },
                { icon: '🚀', title: 'La Fusée', desc: 'Plus forte progression récente.' },
                { icon: '🏰', title: 'Forteresse', desc: 'Meilleur rendement de l’équipe NHL choisie.' }
            ];

            badges.forEach(b => {
                const item = document.createElement('div');
                item.className = 'badge-item';
                item.innerHTML = `
                    <div class="badge-icon">${b.icon}</div>
                    <div class="badge-info">
                        <h4>${b.title}</h4>
                        <p>${b.desc}</p>
                    </div>
                `;
                badgesGrid.appendChild(item);
            });
        }

        window.onload = loadData;
    </script>
</body>
</html>
